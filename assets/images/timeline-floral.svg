<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Rose Velvet Gradients -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b56" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#b8142e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#800a1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petalGrad1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dc143c"/>
      <stop offset="55%" stop-color="#a00e24"/>
      <stop offset="100%" stop-color="#5a0410"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e62042"/>
      <stop offset="60%" stop-color="#960d21"/>
      <stop offset="100%" stop-color="#4a030c"/>
    </radialGradient>
    <linearGradient id="goldCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <filter id="roseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#roseGlow)"/>

  <!-- Outer Rose Petals (5 Layered Petals) -->
  <g filter="url(#roseShadow)">
    <!-- Bottom Petal -->
    <path d="M 50 48 C 30 70, 35 90, 50 90 C 65 90, 70 70, 50 48 Z" fill="url(#petalGrad1)"/>
    <!-- Bottom Left Petal -->
    <path d="M 48 48 C 18 55, 12 78, 28 86 C 42 92, 50 72, 48 48 Z" fill="url(#petalGrad2)"/>
    <!-- Bottom Right Petal -->
    <path d="M 52 48 C 82 55, 88 78, 72 86 C 58 92, 50 72, 52 48 Z" fill="url(#petalGrad2)"/>
    <!-- Top Left Petal -->
    <path d="M 48 48 C 15 35, 20 12, 38 16 C 52 20, 50 40, 48 48 Z" fill="url(#petalGrad1)"/>
    <!-- Top Right Petal -->
    <path d="M 52 48 C 85 35, 80 12, 62 16 C 48 20, 50 40, 52 48 Z" fill="url(#petalGrad1)"/>
    <!-- Top Center Petal -->
    <path d="M 50 50 C 35 30, 38 10, 50 10 C 62 10, 65 30, 50 50 Z" fill="url(#petalGrad2)"/>

    <!-- Mid Layer Overlapping Swirls -->
    <path d="M 32 45 C 28 62, 45 74, 62 68 C 76 62, 74 42, 60 40 C 45 38, 36 32, 32 45 Z" fill="url(#petalGrad1)"/>
    <path d="M 68 45 C 72 62, 55 74, 38 68 C 24 62, 26 42, 40 40 C 55 38, 64 32, 68 45 Z" fill="url(#petalGrad2)"/>

    <!-- Inner Rosebud Core (Classic spiral folds) -->
    <path d="M 40 46 C 36 56, 52 64, 58 56 C 64 48, 54 38, 45 40 C 38 42, 38 52, 50 54 C 56 55, 58 48, 52 46 Z" fill="url(#petalGrad1)"/>
    <path d="M 44 48 C 42 54, 54 58, 56 52 C 58 48, 50 44, 46 46 Z" fill="url(#petalGrad2)"/>

    <!-- Delicate Gold Stamen Pistils -->
    <circle cx="50" cy="49" r="3.5" fill="url(#goldCenter)"/>
    <circle cx="47" cy="47" r="1.5" fill="#fff" opacity="0.7"/>
  </g>
</svg>
